<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pune PMPML Crowd Estimator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🚌 PMPML Crowd Estimator</div>
        <div class="tagline">Real-time DAA Route & Crowd Intelligence</div>
    </header>

    <main class="container">
        <div class="disclaimer-banner">
            ⚠️ <strong>Demonstration Mode:</strong> Bus tracking uses real PMPML stop networks with simulated live crowds for college project evaluation.
        </div>

        <div class="grid-layout">
            <!-- Journey Search Form -->
            <section class="card">
                <h2>Find Your Journey</h2>
                <form id="search-form">
                    <div class="form-group">
                        <label for="origin_id">Origin Stop</label>
                        <select id="origin_id" name="origin_id" required>
                            <option value="">-- Select Origin Stop --</option>
                            {% for stop in stops %}
                            <option value="{{ stop.stop_id }}">{{ stop.stop_name }} (ID: {{ stop.stop_id }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="destination_id">Destination Stop</label>
                        <select id="destination_id" name="destination_id" required>
                            <option value="">-- Select Destination Stop --</option>
                            {% for stop in stops %}
                            <option value="{{ stop.stop_id }}">{{ stop.stop_name }} (ID: {{ stop.stop_id }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="priority">Optimization Priority</label>
                        <select id="priority" name="priority">
                            <option value="balanced">Balanced (Time + Crowd + Transfers)</option>
                            <option value="fastest">Fastest Travel Time (Dijkstra)</option>
                            <option value="least_crowded">Least Crowded Bus/Stops</option>
                        </select>
                    </div>

                    <button type="submit" id="search-btn" class="btn btn-primary">Search Optimal Journey</button>
                </form>
            </section>

            <!-- Live Crowd Reporting Form -->
            <section class="card">
                <h2>Submit Crowd Report</h2>
                <form id="report-form">
                    <div class="form-group">
                        <label for="rep_route_id">Route</label>
                        <select id="rep_route_id" required>
                            <option value="">-- Select Bus Route --</option>
                            {% for r in routes %}
                            <option value="{{ r.route_id }}">{{ r.route_id }} - {{ r.route_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="rep_stop_id">Current Stop</label>
                        <select id="rep_stop_id" required>
                            <option value="">-- Select Stop --</option>
                            {% for stop in stops %}
                            <option value="{{ stop.stop_id }}">{{ stop.stop_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="rep_crowd_level">Crowd Level</label>
                        <select id="rep_crowd_level" required>
                            <option value="1">1 - Empty / Seats Available</option>
                            <option value="2">2 - Moderate / Few Standing</option>
                            <option value="3">3 - Crowded / Standing Full</option>
                            <option value="4">4 - Heavily Crowded</option>
                            <option value="5">5 - Critical / Jam Packed</option>
                        </select>
                    </div>

                    <button type="submit" id="report-btn" class="btn btn-secondary">Submit Passenger Update</button>
                </form>
                <div id="report-status" class="status-msg"></div>
            </section>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
